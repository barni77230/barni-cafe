<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>برني | BARNI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#f5f1e8;
  color:#25251f;
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:45px 20px 25px;
}

.logo{
  font-size:42px;
  font-weight:bold;
  letter-spacing:7px;
}

.subtitle{
  font-size:18px;
  margin-top:8px;
  color:#777064;
}

.container{
  max-width:650px;
  margin:auto;
  padding:20px;
}

h2{
  margin:25px 0 15px;
  font-size:25px;
}

.item{
  background:#fffdf8;
  border:1px solid #ddd6c8;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.item h3{
  font-size:19px;
  margin-bottom:6px;
}

.item p{
  color:#777064;
  font-size:14px;
}

.price{
  margin-top:8px;
  font-weight:bold;
}

button{
  border:0;
  background:#25251f;
  color:white;
  padding:11px 17px;
  border-radius:12px;
  font-size:15px;
}

.cart{
  background:#25251f;
  color:white;
  border-radius:20px;
  padding:22px;
  margin-top:30px;
}

.cart h2{
  margin-top:0;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
}

.total{
  border-top:1px solid #666;
  padding-top:15px;
  margin-top:15px;
  font-size:20px;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #bbb;
  margin:8px 0 12px;
  font-size:16px;
}

.order{
  width:100%;
  background:#d8a24a;
  color:#25251f;
  font-weight:bold;
  margin-top:15px;
}

footer{
  text-align:center;
  padding:40px 20px;
  color:#777064;
}
</style>
</head>

<body>

<header>
  <div class="logo">BARNI</div>
  <div class="subtitle">برني</div>
  <p class="subtitle">قهوة • تمر • لحظات جميلة</p>
</header>

<div class="container">

<h2>☕ القهوة</h2>

<div class="item">
  <div>
    <h3>لاتيه</h3>
    <p>إسبريسو مع حليب كريمي</p>
    <div class="price">1.500 ر.ع</div>
  </div>
  <button onclick="addItem('لاتيه',1.5)">إضافة</button>
</div>

<div class="item">
  <div>
    <h3>أمريكانو</h3>
    <p>إسبريسو مع ماء ساخن</p>
    <div class="price">1.200 ر.ع</div>
  </div>
  <button onclick="addItem('أمريكانو',1.2)">إضافة</button>
</div>

<h2>🌴 التمر</h2>

<div class="item">
  <div>
    <h3>تمر برني</h3>
    <p>تمر برني فاخر</p>
    <div class="price">1.000 ر.ع</div>
  </div>
  <button onclick="addItem('تمر برني',1)">إضافة</button>
</div>

<div class="item">
  <div>
    <h3>قهوة وتمر</h3>
    <p>قهوة مع تمر برني</p>
    <div class="price">2.000 ر.ع</div>
  </div>
  <button onclick="addItem('قهوة وتمر',2)">إضافة</button>
</div>

<div class="cart">

<h2>🛒 طلبك</h2>

<div id="cart"></div>

<div class="total">
المجموع: <span id="total">0.000</span> ر.ع
</div>

<input id="table" type="number" placeholder="رقم الطاولة">

<button class="order" onclick="sendOrder()">
إرسال الطلب
</button>

</div>

</div>

<footer>
BARNI • برني<br>
قهوة وتمرة ولحظات جميلة
</footer>

<script>

let cart = [];

function addItem(name, price){

  cart.push({
    name:name,
    price:price
  });

  updateCart();
}

function updateCart(){

  let cartDiv = document.getElementById("cart");
  let total = 0;

  cartDiv.innerHTML = "";

  cart.forEach((item,index)=>{

    total += item.price;

    cartDiv.innerHTML += `
      <div class="cart-item">
        <span>${item.name}</span>
        <span>${item.price.toFixed(3)} ر.ع</span>
      </div>
    `;

  });

  document.getElementById("total").innerText =
    total.toFixed(3);
}

function sendOrder(){

  if(cart.length === 0){
    alert("أضف منتجًا إلى الطلب أولًا");
    return;
  }

  let table =
    document.getElementById("table").value;

  if(!table){
    alert("اكتب رقم الطاولة");
    return;
  }

  let message = "طلب جديد من برني ☕🌴%0A%0A";

  cart.forEach(item=>{
    message +=
      "• " + item.name +
      " - " + item.price.toFixed(3) +
      " ر.ع%0A";
  });

  let total =
    cart.reduce((sum,item)=>sum + item.price,0);

  message +=
    "%0Aرقم الطاولة: " + table +
    "%0Aالمجموع: " +
    total.toFixed(3) +
    " ر.ع";

  let phone = "968XXXXXXXX";

  window.open(
    "https://wa.me/" + phone +
    "?text=" + message,
    "_blank"
  );
}

</script>

</body>
</html>
